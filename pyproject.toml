[project]
name = "launchkey-mini-mk4-firmware"
version = "0.1.0"
description = "Unpack, analyse, patch and upload Novation Launchkey Mini MK4 firmware"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
]

[tool.uv]
# tools/ are plain scripts run with `uv run python tools/...`; nothing to build or install
package = false
